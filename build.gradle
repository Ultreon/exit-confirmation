plugins {
//	id 'fabric-loom' version '1.10-SNAPSHOT' // TODO Fork Fabric Loom for Quantum Voxel instead of Minecraft
    id 'maven-publish'
    id 'java'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()

    maven { url "https://maven.fabricmc.net/" }

    maven { url "https://jitpack.io" }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/releases/' }

    // At bottom to prevent download errors
    maven { url = uri("https://maven.ultreon.dev/releases") }
    maven { url = uri("https://maven.ultreon.dev/snapshots") }
}

sourceSets {
    client {
        java.srcDirs += "src/client/java"
        resources.srcDirs += "src/client/resources"

        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }

    server {
        java.srcDirs += "src/server/java"
        resources.srcDirs += "src/server/resources"

        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }

    main {
        runtimeClasspath += sourceSets.client.output + sourceSets.server.output
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    clientImplementation "dev.ultreon.quantum:quantum-lwjgl3-v2:0.0.5"
    clientImplementation "dev.ultreon.quantum:quantum-client-v2:0.0.5"
    implementation "dev.ultreon.quantum:quantum-common-v2:0.0.5"
    serverImplementation "dev.ultreon.quantum:quantum-server-v2:0.0.5"

    runtimeOnly "dev.ultreon.quantum:quantum-gameprovider-v2:0.0.5"

    // Fabric
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc:sponge-mixin:${project.mixin_version}"

}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processClientResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processServerResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.register("runClient", JavaExec) {
    dependsOn classes
        mainClass = "net.fabricmc.loader.impl.launch.knot.KnotClient"
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.output

    if (System.getProperty("os.name").contains("Mac")) {
        jvmArgs "-XstartOnFirstThread", "-Dfabric.development=true"
    }

    workingDir = file("run")
}

tasks.register("runServer", JavaExec) {
    dependsOn classes
        mainClass = "net.fabricmc.loader.impl.launch.knot.KnotServer"
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.output

    workingDir = file("run")
}

jar {
    inputs.property "archivesName", project.base.archivesName

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}