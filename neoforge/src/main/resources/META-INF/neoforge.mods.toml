# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader = "javafml"
loaderVersion = "[1,)"
license = "All Rights Reserved"
issueTrackerURL="https://github.com/Ultreon/exit-confirmation/issues" #optional

[[mods]] #mandatory
modId = "exit_confirm"
version = "${version}"
displayName = "Exit Confirmation"
#updateJSONURL="https://myurl.me/"
displayURL="https://ultreon.dev/?id=exit-confirmation#project"
logoFile= "../exit-confirm.png"
credits="Qboi123"
authors = "Ultreon Studios"
description = "Shows an exit confirmation screen when trying to close Minecraft."

[[mixins]]
config = "exit_confirm.mixins.json"

[[mixins]]
config = "exit_confirm.neoforge.mixins.json"

[[dependencies.exit_confirm]]
modId = "neoforge"
type = "required"
versionRange = "21.2]"
ordering = "NONE"
side = "CLIENT"

[[dependencies.exit_confirm]]
modId = "minecraft"
type = "required"
versionRange = "1.21.2"
ordering = "NONE"
side = "CLIENT"
